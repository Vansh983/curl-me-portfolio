    <path d="M 700 860 C 820 760 980 760 1120 820 C 1180 845 1220 855 1260 860 Z" fill="var(--bg)"/>
    <path d="M 1120 860 C 1220 800 1360 790 1600 830 L 1600 860 Z" fill="var(--bg)" stroke-opacity="0.6"/>
  </g>
  <g class="water">
    <path d="M 1200 745 L 1600 745 L 1600 860 L 1200 860 Z" fill="var(--bg)" stroke="none"/>
    <path stroke-width="2.5" d="M 1225 790 q 20 -8 40 0 t 40 0 M 1330 815 q 20 -8 40 0 t 40 0 M 1460 780 q 20 -8 40 0 t 40 0 M 1510 838 q 20 -8 40 0 t 40 0 M 1270 845 q 20 -8 40 0"/>
  </g>
