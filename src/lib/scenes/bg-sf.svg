    <path d="M 820 860 L 820 736 L 845 716 L 870 736 L 870 860 Z" fill="var(--bg)"/>
    <path d="M 870 860 L 870 722 L 895 702 L 920 722 L 920 860 Z" fill="var(--bg)"/>
    <path d="M 920 860 L 920 712 L 945 692 L 970 712 L 970 860 Z" fill="var(--bg)"/>
    <path stroke="none" fill="currentColor" d="M 735 790 h 20 v 26 h -20 Z M 785 772 h 20 v 26 h -20 Z M 835 756 h 20 v 26 h -20 Z M 885 742 h 20 v 26 h -20 Z M 935 732 h 20 v 26 h -20 Z M 738 832 h 14 v 28 h -14 Z M 838 828 h 14 v 32 h -14 Z M 938 826 h 14 v 34 h -14 Z"/>
    <path stroke-width="2.5" d="M 745 750 L 745 736 M 795 732 L 795 718 M 895 702 L 895 688"/>
  </g>
  <g class="towers">
    <path d="M 1322 860 L 1322 372 L 1338 372 L 1338 356 L 1358 356 L 1358 372 L 1374 372 L 1374 860 Z" fill="var(--acc)"/>
    <path d="M 1332 440 h 32 M 1332 520 h 32 M 1332 600 h 32 M 1332 680 h 32 M 1338 372 v 488 M 1358 372 v 488" stroke-width="2.5"/>
    <path d="M 1532 860 L 1532 372 L 1548 372 L 1548 356 L 1568 356 L 1568 372 L 1584 372 L 1584 860 Z" fill="var(--acc)"/>
    <path d="M 1542 440 h 32 M 1542 520 h 32 M 1542 600 h 32 M 1542 680 h 32 M 1548 372 v 488 M 1568 372 v 488" stroke-width="2.5"/>
  </g>
  <g class="deck">
    <path d="M 1200 694 L 1600 694 L 1600 716 L 1200 716 Z" fill="var(--bg)"/>
    <path stroke-width="2" d="M 1215 694 v -14 M 1245 694 v -14 M 1275 694 v -14 M 1305 694 v -14 M 1395 694 v -14 M 1425 694 v -14 M 1455 694 v -14 M 1485 694 v -14 M 1515 694 v -14 M 1600 680 L 1215 680"/>
  </g>
  <g class="cable draw">
    <path pathLength="1" stroke-width="6" d="M 1200 716 C 1260 560 1320 400 1348 362 C 1400 560 1500 560 1558 362 C 1575 430 1590 470 1600 490"/>
