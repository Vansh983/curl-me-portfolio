<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- San Francisco. Groups are animated by the stage: hills and houses pop up, the towers rise, the deck slides in, the cable and hangers draw, fog drifts. -->
