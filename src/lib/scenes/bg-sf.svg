  <g class="hangers draw">
    <path pathLength="1" stroke-width="2.5" d="M 1230 694 v -34 M 1260 694 v -104 M 1290 694 v -170 M 1320 694 v -240 M 1390 694 v -205 M 1420 694 v -160 M 1453 694 v -140 M 1486 694 v -160 M 1516 694 v -205 M 1590 694 v -220"/>
