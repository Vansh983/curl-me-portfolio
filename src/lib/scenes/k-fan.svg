<svg xmlns="http://www.w3.org/2000/svg" viewBox="-240 -80 480 140" fill="none" stroke="none">
  <!-- ceiling fan seen from the front: the blades sweep in a flattened ellipse -->
  <rect x="-6" y="-80" width="12" height="46" fill="#33535F"/>
  <ellipse cx="0" cy="-34" rx="26" ry="9" fill="#33535F"/>
  <g transform="translate(0 -14) scale(1 0.26)">
    <g data-motion="spin" style="animation-range: entry 0% exit 100%; transform-origin: 0px 0px">
      <rect x="34" y="-16" width="190" height="32" rx="16" fill="#8B6B4A"/>
      <rect x="34" y="-16" width="190" height="32" rx="16" fill="#8B6B4A" transform="rotate(120)"/>
      <rect x="34" y="-16" width="190" height="32" rx="16" fill="#8B6B4A" transform="rotate(240)"/>
      <circle cx="0" cy="0" r="40" fill="#33535F"/>
    </g>
  </g>
  <ellipse cx="0" cy="-14" rx="34" ry="12" fill="#2A4550"/>
</svg>
