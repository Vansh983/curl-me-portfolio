<svg xmlns="http://www.w3.org/2000/svg" viewBox="-240 -80 480 140" fill="none" stroke="none">
  <!-- ceiling fan seen from the front. The blades spin on their own clock, flattened into an ellipse by the parent scale. -->
  <rect x="-6" y="-80" width="12" height="52" fill="#33535F"/>
  <g transform="translate(0 -14) scale(1 0.26)">
    <g data-loop="spin">
      <circle cx="0" cy="0" r="230" fill="none"/>
      <rect x="30" y="-17" width="196" height="34" rx="17" fill="#8B6B4A"/>
      <rect x="30" y="-17" width="196" height="34" rx="17" fill="#8B6B4A" transform="rotate(120)"/>
      <rect x="30" y="-17" width="196" height="34" rx="17" fill="#8B6B4A" transform="rotate(240)"/>
    </g>
    <circle cx="0" cy="0" r="54" fill="#33535F"/>
    <circle cx="0" cy="0" r="18" fill="#2A4550"/>
  </g>
  <ellipse cx="0" cy="-30" rx="24" ry="8" fill="#33535F"/>
</svg>
