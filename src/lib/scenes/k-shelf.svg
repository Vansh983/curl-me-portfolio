  <path d="M 24 120 l -10 20 h 8 l 8 -20 Z M 276 120 l 10 20 h -8 l -8 -20 Z" fill="#6E5238"/>
  <g font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="7" fill="#F9F4EC">
    <!-- Harry Potter, the Bloomsbury spines -->
    <rect x="14" y="30" width="18" height="76" rx="1.5" fill="#B33A2B"/><text transform="translate(26 100) rotate(-90)">HARRY POTTER</text>
    <rect x="34" y="26" width="18" height="80" rx="1.5" fill="#2E6B3F"/><text transform="translate(46 100) rotate(-90)">HARRY POTTER</text>
    <rect x="54" y="28" width="18" height="78" rx="1.5" fill="#3B4F8C"/><text transform="translate(66 100) rotate(-90)">HARRY POTTER</text>
    <rect x="74" y="22" width="20" height="84" rx="1.5" fill="#C98A1E"/><text transform="translate(87 100) rotate(-90)">HARRY POTTER</text>
    <rect x="96" y="20" width="22" height="86" rx="1.5" fill="#7A2E8C"/><text transform="translate(110 100) rotate(-90)">HARRY POTTER</text>
    <rect x="120" y="24" width="20" height="82" rx="1.5" fill="#1F6E6E"/><text transform="translate(133 100) rotate(-90)">HARRY POTTER</text>
    <rect x="142" y="22" width="20" height="84" rx="1.5" fill="#8C2B2B"/><text transform="translate(155 100) rotate(-90)">HARRY POTTER</text>
    <!-- Percy Jackson -->
    <rect x="166" y="32" width="18" height="74" rx="1.5" fill="#1D3557"/><text transform="translate(178 100) rotate(-90)" font-size="6.5">PERCY JACKSON</text>
    <rect x="186" y="32" width="18" height="74" rx="1.5" fill="#2A6F97"/><text transform="translate(198 100) rotate(-90)" font-size="6.5">PERCY JACKSON</text>
    <!-- the Famous Five -->
    <rect x="208" y="40" width="14" height="66" rx="1.5" fill="#E07A2F"/><text transform="translate(218 100) rotate(-90)" font-size="5.6">FAMOUS FIVE</text>
    <rect x="224" y="40" width="14" height="66" rx="1.5" fill="#D94F3D"/><text transform="translate(234 100) rotate(-90)" font-size="5.6">FAMOUS FIVE</text>
    <rect x="240" y="40" width="14" height="66" rx="1.5" fill="#E9A23B"/><text transform="translate(250 100) rotate(-90)" font-size="5.6">FAMOUS FIVE</text>
  </g>
  <!-- an Xbox 360 game case leaning at the end -->
  <g transform="rotate(-16 282 106)">
    <rect x="262" y="42" width="24" height="64" rx="2" fill="#6FA84F"/>
    <rect x="262" y="42" width="24" height="7" fill="#F9F4EC"/>
    <rect x="266" y="60" width="16" height="30" fill="#2E2E2E"/>
  </g>
