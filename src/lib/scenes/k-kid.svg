<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" fill="none" stroke="none">
  <!-- him, about nine, seen from behind, cross-legged on the floor, controller held in front at lap height -->
  <g data-motion="sway" style="animation-range: entry 0% exit 100%">
    <!-- crossed legs, knees out, feet tucked -->
    <path d="M 84 396 C 66 352 110 326 158 336 C 172 340 188 340 202 336 C 250 326 294 352 276 396 C 258 412 102 412 84 396 Z" fill="#33535F"/>
    <path d="M 132 398 c -10 -14 -2 -30 14 -30 c 16 0 24 16 12 30 Z M 228 398 c 10 -14 2 -30 -14 -30 c -16 0 -24 16 -12 30 Z" fill="#F1C7A3"/>
    <!-- t shirt, narrow shoulders, slim waist -->
    <path d="M 132 190 C 146 174 214 174 228 190 L 240 350 C 210 362 150 362 120 350 Z" fill="#F2575D"/>
    <path d="M 132 190 C 146 174 214 174 228 190 L 232 222 C 208 232 152 232 128 222 Z" fill="#CC4341"/>
    <!-- arms: elbows a little out, forearms coming together in front -->
    <path d="M 126 194 C 96 206 82 246 90 282 C 96 292 110 292 116 284 C 112 258 122 236 136 226 Z" fill="#F2575D"/>
    <path d="M 234 194 C 264 206 278 246 270 282 C 264 292 250 292 244 284 C 248 258 238 236 224 226 Z" fill="#F2575D"/>
    <path d="M 90 282 C 100 306 124 318 150 316 L 150 298 C 130 298 112 292 104 276 Z" fill="#F1C7A3"/>
    <path d="M 270 282 C 260 306 236 318 210 316 L 210 298 C 230 298 248 292 256 276 Z" fill="#F1C7A3"/>
    <!-- the controller, held at the lap, the top edge and both grips showing between the hands -->
    <g data-motion="tilt" style="animation-range: entry 0% exit 100%">
      <path d="M 138 296 C 150 290 210 290 222 296 C 236 302 240 322 230 330 C 222 336 212 330 206 322 L 154 322 C 148 330 138 336 130 330 C 120 322 124 302 138 296 Z" fill="#ECECEA"/>
      <path d="M 154 322 h 52 v 10 h -52 Z" fill="#D9D9D6"/>
      <circle cx="180" cy="304" r="7" fill="#7AC142"/>
      <circle cx="158" cy="306" r="4" fill="#9A9A96"/>
      <circle cx="202" cy="306" r="4" fill="#9A9A96"/>
    </g>
    <!-- hands over the grips -->
    <path d="M 132 306 c -6 10 0 22 14 22 c 12 0 18 -12 12 -22 Z M 228 306 c 6 10 0 22 -14 22 c -12 0 -18 -12 -12 -22 Z" fill="#F1C7A3"/>
    <!-- the tie, not on him yet -->
    <path d="M 180 232 L 181 232 L 181 234 L 180 235 L 179 234 Z" fill="#1D3557" fill-opacity="0"/>
    <!-- neck and the back of the head -->
    <rect x="166" y="132" width="28" height="48" rx="10" fill="#F1C7A3"/>
    <ellipse cx="180" cy="100" rx="50" ry="56" fill="#F1C7A3"/>
    <ellipse cx="180" cy="90" rx="50" ry="48" fill="#17282F"/>
    <path d="M 130 100 C 138 126 156 138 180 138 C 204 138 222 126 230 100 C 220 116 202 122 180 122 C 158 122 140 116 130 100 Z" fill="#17282F"/>
    <ellipse cx="132" cy="108" rx="8" ry="11" fill="#F1C7A3"/>
    <ellipse cx="228" cy="108" rx="8" ry="11" fill="#F1C7A3"/>
    <!-- the chair, not here yet -->
    <rect x="180" y="380" width="0.5" height="0.5" rx="0" fill="#8B6B4A" opacity="0"/>
    <rect x="180" y="380" width="0.5" height="0.5" fill="#6E5238" opacity="0"/>
  </g>
</svg>
