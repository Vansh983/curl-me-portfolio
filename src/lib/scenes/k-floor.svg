<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none" stroke="none">
  <!-- the floor: a rug, chai, a plate of chicken nuggets with ketchup, a cricket ball that rolls in, the extension board -->
  <ellipse cx="880" cy="846" rx="300" ry="46" fill="#8E3B46"/>
  <ellipse cx="880" cy="846" rx="240" ry="32" fill="#A84550"/>
  <ellipse cx="880" cy="846" rx="150" ry="18" fill="#8E3B46"/>
  <!-- chai and the steam -->
  <g>
    <ellipse cx="1110" cy="856" rx="30" ry="7" fill="#F9F4EC"/>
    <path d="M 1091 816 h 38 l -4 38 h -30 Z" fill="#F9F4EC"/>
    <path d="M 1094 828 h 32 l -3 24 h -26 Z" fill="#B87333"/>
    <path d="M 1129 822 c 12 0 16 16 5 22 l -3 -9 c 5 -2 2 -7 -2 -7 Z" fill="#F9F4EC"/>
    <g data-motion="steam" style="animation-range: entry 0% exit 100%">
      <path d="M 1102 808 c -8 -12 8 -18 0 -30 M 1118 804 c -8 -12 8 -18 0 -30" stroke="#F9F4EC" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8"/>
    </g>
  </g>
  <!-- chicken nuggets on a plate, ketchup on the side -->
  <g transform="translate(-200 0)">
  <ellipse cx="1190" cy="862" rx="60" ry="14" fill="#F9F4EC"/>
  <ellipse cx="1190" cy="859" rx="50" ry="10" fill="#EFE8DC"/>
  <path d="M 1150 856 c -4 -10 6 -16 16 -14 c 8 2 12 10 6 16 c -6 4 -18 6 -22 -2 Z" fill="#D9A24D"/>
  <path d="M 1176 848 c 2 -10 16 -12 22 -6 c 6 6 2 16 -8 16 c -8 0 -16 -2 -14 -10 Z" fill="#E0AC55"/>
  <path d="M 1204 856 c -2 -12 14 -14 20 -8 c 6 6 4 14 -6 16 c -8 2 -14 0 -14 -8 Z" fill="#D9A24D"/>
  <path d="M 1166 862 c 0 -8 12 -10 18 -6 c 6 4 4 12 -4 14 c -8 2 -14 0 -14 -8 Z" fill="#C9903C"/>
  <path d="M 1190 864 c 2 -8 14 -8 18 -2 c 4 6 0 12 -8 12 c -6 0 -12 -4 -10 -10 Z" fill="#E0AC55"/>
  <ellipse cx="1226" cy="864" rx="12" ry="6" fill="#D62828"/>
  </g>
  <!-- the cricket ball -->
  <g data-motion="roll" style="animation-range: entry 0% entry 90%">
    <circle cx="540" cy="842" r="18" fill="#A52A2A"/>
    <path d="M 526 830 c 8 10 20 14 28 24" stroke="#F9F4EC" stroke-width="2.5" stroke-dasharray="3 3"/>
  </g>
  <!-- an extension board with the console wire -->
  <rect x="690" y="836" width="90" height="16" rx="3" fill="#F9F4EC"/>
  <path d="M 702 844 h 8 M 718 844 h 8 M 734 844 h 8 M 750 844 h 8" stroke="#33535F" stroke-width="4" stroke-linecap="round"/>
  <path d="M 690 844 C 650 844 630 800 610 760" stroke="#33535F" stroke-width="3" fill="none"/>
  <path d="M 780 844 C 900 842 1000 846 1150 800" stroke="#33535F" stroke-width="3" fill="none"/>
</svg>
