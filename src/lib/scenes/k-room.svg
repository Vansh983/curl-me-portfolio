<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none" stroke="none">
  <!-- Delhi bedroom, far wall: warm wall, floor, a window onto the rooftops at dusk, curtains -->
  <rect x="0" y="0" width="1600" height="710" fill="#FBFBF9"/>
  <rect x="0" y="0" width="1600" height="70" fill="#F1F1EE"/>
  <rect x="0" y="690" width="1600" height="16" fill="#E4E1DA"/>
  <rect x="0" y="706" width="1600" height="194" fill="#DCC3A5"/>
  <rect x="0" y="706" width="1600" height="10" fill="#C4A882"/>
  <!-- wall socket and the wire that goes to the TV, a Delhi bedroom always has one -->
  <rect x="1090" y="600" width="46" height="34" rx="4" fill="#EDE3D6" stroke="#CDBBA4" stroke-width="3"/>
  <path d="M 1103 612 h 6 v 12 h -6 Z M 1117 612 h 6 v 12 h -6 Z" fill="#7B6A57"/>
  <!-- window -->
  <g>
    <rect x="1170" y="140" width="360" height="390" rx="6" fill="#F9F4EC" stroke="#DFCFB9" stroke-width="4"/>
    <g data-motion="dusk" style="animation-range: entry 0% exit 100%">
      <rect x="1190" y="160" width="320" height="350" fill="#F7B267"/>
      <rect x="1190" y="160" width="320" height="150" fill="#E9A15E"/>
      <rect x="1190" y="160" width="320" height="80" fill="#C98352"/>
    </g>
    <circle cx="1300" cy="352" r="42" fill="#F2575D"/>
    <!-- Delhi rooftops out the window -->
    <path d="M 1190 400 h 40 v -30 h 60 v 18 h 40 v -40 h 30 v 52 h 50 v -22 h 40 v 30 h 30 v -70 h 12 v -60 l 6 -8 l 6 8 v 60 h 12 v 70 h 4 v 110 h -330 Z" fill="#33535F"/>
    <path d="M 1246 356 v -22 a 12 5 0 0 1 24 0 v 22 Z M 1394 366 v -20 a 11 5 0 0 1 22 0 v 20 Z" fill="#2A4550"/>
    <path d="M 1300 380 v -34 M 1292 356 h 16 M 1294 366 h 12" stroke="#2A4550" stroke-width="3" stroke-linecap="round"/>
    <path d="M 1190 470 h 330 v 40 h -330 Z" fill="#2A4550"/>
    <rect x="1343" y="160" width="14" height="350" fill="#F9F4EC"/>
    <rect x="1190" y="328" width="320" height="14" fill="#F9F4EC"/>
    <!-- window light on the wall -->
    <path d="M 1170 530 L 1090 700 H 1610 L 1530 530 Z" fill="#F7B267" fill-opacity="0.12"/>
  </g>
  <!-- curtains -->
  <path d="M 1120 120 C 1180 130 1180 300 1150 540 C 1140 545 1112 545 1104 540 C 1120 300 1090 130 1120 120 Z" fill="#E7A79A"/>
  <path d="M 1590 120 C 1530 130 1530 300 1560 540 C 1570 545 1596 545 1600 540 C 1590 300 1620 130 1590 120 Z" fill="#E7A79A"/>
  <!-- the rod fades away; the lab board has its own element so it does not balloon through the room -->
  <rect x="1090" y="110" width="520" height="16" rx="8" fill="#8B6B4A" opacity="1"/>
  <rect x="600" y="300" width="520" height="260" rx="8" fill="#FFFFFF" opacity="0"/>
</svg>
