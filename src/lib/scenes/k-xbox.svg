<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 130" fill="none" stroke="none">
  <!-- the Xbox 360 on the floor, lying flat, ring of light on, with the Call of Duty case leaning on it -->
  <!-- console: white, the concave waist, the disc tray, the ring -->
  <path d="M 70 64 C 100 56 200 56 230 64 L 226 106 C 200 112 100 112 74 106 Z" fill="#ECECEA"/>
  <path d="M 70 64 C 100 56 200 56 230 64 L 229 72 C 200 66 100 66 71 72 Z" fill="#DADAD7"/>
  <path d="M 84 82 h 96 v 4 h -96 Z M 84 92 h 70 v 3 h -70 Z" fill="#C8C8C4"/>
  <rect x="84" y="100" width="40" height="3" fill="#C8C8C4"/>
  <g data-motion="pulse" style="animation-range: entry 0% exit 100%">
    <circle cx="202" cy="86" r="15" fill="none" stroke="#7AC142" stroke-width="5" stroke-dasharray="20 4"/>
    <circle cx="202" cy="86" r="5" fill="#7AC142"/>
  </g>
  <path d="M 74 106 C 100 112 200 112 226 106 L 226 112 C 200 118 100 118 74 112 Z" fill="#C8C8C4"/>
  <!-- the game case, leaning against the console -->
  <g transform="rotate(-12 56 112)">
    <rect x="14" y="20" width="60" height="92" rx="2" fill="#1A1A1A"/>
    <rect x="14" y="20" width="60" height="8" fill="#6FA84F"/>
    <rect x="18" y="34" width="52" height="60" fill="#2B2B2B"/>
    <path d="M 24 88 l 12 -22 l 8 12 l 10 -18 l 12 28 Z" fill="#3A3A3A"/>
    <text x="44" y="52" text-anchor="middle" font-family="'Bebas Neue', Impact, 'Arial Narrow', sans-serif" font-size="13" letter-spacing="0.5" fill="#F5F5F5">CALL·OF·DUTY</text>
    <text x="44" y="64" text-anchor="middle" font-family="'Bebas Neue', Impact, 'Arial Narrow', sans-serif" font-size="9" letter-spacing="1" fill="#7AC142">WORLD AT WAR</text>
    <text x="44" y="104" text-anchor="middle" font-family="'Bebas Neue', Impact, 'Arial Narrow', sans-serif" font-size="8" letter-spacing="1.5" fill="#C9C9C9">ZOMBIES</text>
  </g>
</svg>
