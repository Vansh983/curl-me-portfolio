<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" fill="none" stroke="none">
  <!-- him at thirteen, white shirt and tie, on a chair at the lab desk, seen from behind and a little to the right.
       Same element order and path commands as k-kid.svg so the two morph into each other. -->
  <g data-motion="sway" style="animation-range: entry 0% exit 100%">
    <!-- trousers, thighs forward under the desk -->
    <path d="M 126 392 C 118 348 150 326 186 334 C 206 340 226 342 240 350 C 262 362 262 388 252 396 C 236 404 142 404 126 392 Z" fill="#5B6470"/>
    <!-- shoes -->
    <path d="M 146 414 c -8 -10 -2 -22 10 -22 c 12 0 18 12 10 22 Z M 226 414 c 8 -10 2 -22 -10 -22 c -12 0 -18 12 -10 22 Z" fill="#17282F"/>
    <!-- white shirt -->
    <path d="M 128 190 C 142 174 210 174 224 190 L 232 344 C 204 356 150 356 122 344 Z" fill="#F4F4F2"/>
    <path d="M 128 190 C 142 174 210 174 224 190 L 226 214 C 202 224 150 224 126 214 Z" fill="#E3E3DF"/>
    <!-- arms reaching the keyboard and the mouse -->
    <path d="M 126 194 C 96 206 84 240 92 268 C 98 278 112 278 118 270 C 114 250 124 232 138 224 Z" fill="#F4F4F2"/>
    <path d="M 226 194 C 262 200 284 226 292 256 C 290 268 276 270 270 262 C 262 244 248 232 236 226 Z" fill="#F4F4F2"/>
    <path d="M 92 268 C 104 292 130 300 158 296 L 158 280 C 136 282 116 276 106 262 Z" fill="#F1C7A3"/>
    <path d="M 292 256 C 292 282 274 300 250 300 L 248 282 C 266 282 278 272 280 258 Z" fill="#F1C7A3"/>
    <!-- the controller became the mouse -->
    <g data-motion="tilt" style="animation-range: entry 0% exit 100%">
      <path d="M 236 300 C 242 296 258 296 264 300 C 270 304 270 312 266 316 C 262 318 258 316 256 314 L 244 314 C 242 316 238 318 234 316 C 230 312 230 304 236 300 Z" fill="#ECECEA"/>
      <path d="M 240 306 h 20 v 2 h -20 Z" fill="#D9D9D6"/>
      <circle cx="250" cy="303" r="2" fill="#9A9A96"/>
      <circle cx="250" cy="303" r="1" fill="#9A9A96"/>
      <circle cx="250" cy="303" r="1" fill="#9A9A96"/>
    </g>
    <!-- hands: left on the keyboard, right on the mouse -->
    <path d="M 148 288 c -6 10 0 22 14 22 c 12 0 18 -12 12 -22 Z M 262 298 c 6 10 0 22 -14 22 c -12 0 -18 -12 -12 -22 Z" fill="#F1C7A3"/>
    <!-- the tie -->
    <path d="M 212 206 L 226 208 L 244 298 L 236 310 L 224 296 Z" fill="#1D3557" fill-opacity="1"/>
    <!-- neck and the back of the head, turned a little to the screen -->
    <rect x="168" y="132" width="28" height="48" rx="10" fill="#F1C7A3"/>
    <ellipse cx="184" cy="100" rx="50" ry="56" fill="#F1C7A3"/>
    <ellipse cx="182" cy="90" rx="50" ry="48" fill="#17282F"/>
    <path d="M 134 100 C 142 126 160 138 184 138 C 208 138 226 126 234 100 C 224 116 206 122 184 122 C 162 122 144 116 134 100 Z" fill="#17282F"/>
    <ellipse cx="137" cy="108" rx="6" ry="9" fill="#F1C7A3"/>
    <ellipse cx="233" cy="108" rx="8" ry="11" fill="#F1C7A3"/>
    <!-- the chair: a backrest bar behind his waist and the post -->
    <rect x="116" y="386" width="140" height="14" rx="6" fill="#8B6B4A" opacity="1"/>
    <rect x="180" y="400" width="10" height="20" fill="#6E5238" opacity="1"/>
  </g>
</svg>
